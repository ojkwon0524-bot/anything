name: cgv-imax-watch

on:
  # Times are UTC. 22:00-15:00 UTC == 07:00-01:00 KST.
  schedule:
    - cron: "3-58/5 22,23,0-15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | baseline | probe"
        default: "normal"

permissions:
  contents: write

concurrency:
  group: cgv-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check CGV
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOV_NO: ${{ vars.MOV_NO || '30001323' }}
          MOV_LABEL: ${{ vars.MOV_LABEL || '오디세이' }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            baseline) python check.py --baseline ;;
            probe)    python check.py --probe ;;
            *)        python check.py ;;
          esac

      - name: Save what we saw
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "cgv-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git pull --rebase --autostash || true
            git push
          fi
